<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3eee8">
<title>محمد خليفة & سارة عيد | حفلة خطوبة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
<section id="page1" class="page page1 active" aria-label="غلاف الدعوة">
<img class="page-art desktop-art" src="invitation-cover.png" alt="دعوة خطوبة محمد خليفة وسارة عيد">
<img class="page-art mobile-art" src="invitation-cover-mobile.png" alt="دعوة خطوبة محمد خليفة وسارة عيد">
<button id="openInvitation" class="hotspot open-hotspot" aria-label="افتحي الدعوة"><span>افتحي الدعوة</span><b>←</b></button>
</section>
<section id="page2" class="page page2" aria-label="تفاصيل الدعوة" aria-hidden="true">
<img class="page-art desktop-art" src="details-page.png" alt="تفاصيل حفلة خطوبة محمد خليفة وسارة عيد">
<img class="page-art mobile-art" src="details-page-mobile.png" alt="تفاصيل حفلة خطوبة محمد خليفة وسارة عيد">
<div class="actions" aria-label="اختيارات الدعوة">
<button class="action action-photos" data-action="photos" aria-label="صور الحفلة">صور الحفلة</button>
<button class="action action-share" data-action="share" aria-label="مشاركة الدعوة">مشاركة الدعوة</button>
<button class="action action-rsvp" data-action="rsvp" aria-label="تأكيد الحضور">تأكيد الحضور</button>
<button class="action action-location" data-action="location" aria-label="الموقع">الموقع</button>
</div>
<button id="musicToggle" class="music-toggle" aria-label="تشغيل أو إيقاف الموسيقى">♫</button>
</section>
</main>
<div id="transition" class="transition" aria-hidden="true"><canvas id="matrixCanvas"></canvas><div class="silver-flash"></div><div class="transition-glow"></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="rsvpModal" class="modal" aria-hidden="true"><div class="modal-card"><button class="modal-close" id="closeModal" aria-label="إغلاق">×</button><h2>تأكيد الحضور</h2><p>اختاري ردك على الدعوة:</p><div class="rsvp-options"><button data-rsvp="yes">سأحضر ❤️</button><button data-rsvp="no">أعتذر عن الحضور</button></div><p class="modal-note">يمكنك إضافة رابط تأكيد الحضور الحقيقي من داخل <b>script.js</b>.</p></div></div>
<audio id="bgMusic" src="love-me-like-you-do.mp3" loop preload="auto"></audio>
<audio id="clickSound" src="cute-kiss.wav" preload="auto"></audio>
<script src="script.js"></script>
</body>
</html>
